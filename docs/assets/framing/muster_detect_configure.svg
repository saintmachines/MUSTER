   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243eb6" x="43.2" y="36.597656" transform="rotate(-0 43.2 36.597656)">MUSTER</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 30px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1d22" x="43.2" y="76.795313" transform="rotate(-0 43.2 76.795313)">Detect before you construct.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="43.2" y="104.357344" transform="rotate(-0 43.2 104.357344)">Use source structure to configure retrieval and context assembly.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="43.2" y="141.598125" transform="rotate(-0 43.2 141.598125)">01  USE THE SOURCE</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="360" y="141.598125" transform="rotate(-0 360 141.598125)">02  DETECT</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="687.6" y="141.598125" transform="rotate(-0 687.6 141.598125)">03  CONFIGURE</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1d22" x="56.16" y="180.6375" transform="rotate(-0 56.16 180.6375)">Stored text as evidence</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 201.318281)">1. Alice's employer is Zynga</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 216.561273)">2. Alice's employer is Google</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 231.804266)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 247.047258)">Blank-line records / messages</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 262.29025)">Continuous prose</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 277.533242)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 292.776234)">No generative rewrite</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243eb6" x="372.96" y="180.6375" transform="rotate(-0 372.96 180.6375)">serial</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 201.698203)">Integer-dot share of non-empty lines.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 217.634059)">≥0.80 → numbered branch.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243eb6" x="372.96" y="262.7175" transform="rotate(-0 372.96 262.7175)">recshare</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 283.778203)">Token-weighted bounded-record share.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 299.714059)">≥0.90: records; otherwise: prose.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 315.649914)">Protocol sets the reference scale.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1d22" x="700.56" y="180.6375" transform="rotate(-0 700.56 180.6375)">Choose a retrieval plan</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(700.56 202.837969)">Unit: record or text chunk</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(700.56 220.852414)">Parent: slot or container</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(700.56 238.866859)">Order: serial, only where derived</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(700.56 256.881305)">Policy: parent-priority or balanced floors</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="360" y="349.638281" transform="rotate(-0 360 349.638281)">No query, gold label or LLM in this decision.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1d22" x="56.16" y="399.5175" transform="rotate(-0 56.16 399.5175)">04  RETRIEVE + RERANK</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 420.578203)">Dense + BM25 + parent graph</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 436.514059)">One shared cross-encoder score</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 452.449914)">Neighbour candidates only where configured</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1d22" x="372.96" y="399.5175" transform="rotate(-0 372.96 399.5175)">05  ASSEMBLE THE CONTEXT</text>
   </g>
   <g id="text_19">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 420.578203)">Stored order; parent containers where configured.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 436.514059)">Keep newest only when order/slot checks pass.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(372.96 452.449914)">Keep the persistent store unchanged.</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243eb6" x="714.96" y="399.5175" transform="rotate(-0 714.96 399.5175)">06  ANSWER FROM EVIDENCE</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(714.96 420.958125)">The reader uses the selected evidence.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(714.96 437.586844)">Also use it on model-written memories,</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(714.96 454.215563)">without rebuilding the persistent store.</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="43.2" y="518.158125" transform="rotate(-0 43.2 518.158125)">THE ABLATION: STRUCTURE CHANGES THE RESULT</text>
   </g>
   <g id="text_23">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="43.2" y="541.198125" transform="rotate(-0 43.2 541.198125)">MemoryAgentBench Overall · GPT-4o-mini reader · reported per-question budget</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 34px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1d22" x="56.16" y="603.274688" transform="rotate(-0 56.16 603.274688)">50.3</text>
   </g>
   <g id="text_25">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 631.198125)">Hybrid retrieval + assembly</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(56.16 646.915031)">benchmark chunks, detection off</text>
   </g>
   <g id="text_26">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="350.64" y="606.237188" transform="rotate(-0 350.64 606.237188)">→</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 34px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1d22" x="383.76" y="603.274688" transform="rotate(-0 383.76 603.274688)">56.0</text>
   </g>
   <g id="text_28">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(383.76 631.198125)">+ detected units, parents, order</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(383.76 646.915031)">balanced floors held fixed</text>
   </g>
   <g id="text_29">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="678.24" y="606.237188" transform="rotate(-0 678.24 606.237188)">→</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 34px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243eb6" x="711.36" y="603.274688" transform="rotate(-0 711.36 603.274688)">57.5</text>
   </g>
   <g id="text_31">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(711.36 631.198125)">+ structure-dependent policy gate</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #515867" transform="translate(711.36 646.915031)">MUSTER</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243eb6" x="43.2" y="709.037813" transform="rotate(-0 43.2 709.037813)">+5.7 points from detected representation; +1.5 further points from the policy gate.</text>
   </g>
   <g id="text_33">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="43.2" y="734.118281" transform="rotate(-0 43.2 734.118281)">Scope: the numbered branch recognizes integer-dot records; arbitrary dates or JSON IDs do not activate it.</text>
   </g>
   <g id="text_34">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #515867" x="43.2" y="756.398438" transform="rotate(-0 43.2 756.398438)">Sources: MUSTER §3, Algorithm 1 and Table 2. LongMemEval keeps its native rounds / sessions as the documented exception.</text>
   </g>
  </g>
 </g>
