[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "muster-memory"
dynamic = ["version"]
description = "MUSTER: lossless long-term memory for agents, set by its own text, with no LLM calls to build or grow it"
readme = "docs/library/README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SAINT Machines" }]
requires-python = ">=3.10"
dependencies = ["tiktoken>=0.7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/saintmachines/MUSTER"
Repository = "https://github.com/saintmachines/MUSTER"
Documentation = "https://github.com/saintmachines/MUSTER/blob/main/docs/library/README.md"
Issues = "https://github.com/saintmachines/MUSTER/issues"

[project.optional-dependencies]
models = [
  "numpy>=1.26",
  "nltk>=3.9.1",
  "rank-bm25==0.2.2",
  "torch>=2.3",
  "sentence-transformers>=5,<6",
  "transformers",
]
parquet = ["pandas", "pyarrow"]
mcp = ["mcp>=1.2"]
agents = ["openai-agents>=0.24,<0.25"]
langchain = ["langchain-core>=1.6,<2"]
langgraph = ["langgraph>=1.2,<2"]
dev = ["pytest", "hypothesis", "build", "hatchling"]

[project.scripts]
muster = "muster.cli:main"

[tool.hatch.version]
path = "muster/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["muster"]

[tool.hatch.build.targets.sdist]
only-include = ["muster", "docs/library", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests/ci"]
