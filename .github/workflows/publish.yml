name: Publish muster-memory

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Verified package tag, for example v0.1.0'
        required: true
        type: string
      publish:
        description: 'Upload to PyPI after the build checks'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require the package version and all six CI jobs at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import ast, json, os, pathlib, re, subprocess, urllib.request
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Use a stable vX.Y.Z package tag'
          module = ast.parse(pathlib.Path('muster/_version.py').read_text())
          version = ast.literal_eval(module.body[0].value)
          assert tag == 'v' + version, 'Tag and package version differ'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          assert commit == tagged, 'The checkout must be the package tag itself'
          api = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              request = urllib.request.Request(api + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          runs = get('/actions/workflows/ci.yml/runs?head_sha=' + commit + '&event=push&per_page=100')['workflow_runs']
          assert runs, 'No push CI run for the tagged source'
          latest = max(runs, key=lambda run: run['id'])
          assert latest['status'] == 'completed' and latest['conclusion'] == 'success', 'Wait for successful CI'
          jobs = get('/actions/runs/' + str(latest['id']) + '/jobs?per_page=100')['jobs']
          assert len(jobs) == 6 and all(job['conclusion'] == 'success' for job in jobs), 'All six package jobs must pass'
          print('Verified', tag, commit, 'with six successful CI jobs')
          PY
      - name: Load the reviewed build environment
        run: |
          python - <<'PY'
          import ast, json, os, pathlib
          spec = json.loads(pathlib.Path('RELEASE_BUILD.json').read_text())
          version = ast.literal_eval(ast.parse(pathlib.Path('muster/_version.py').read_text()).body[0].value)
          assert spec['package'] == 'muster-memory' and spec['version'] == version
          assert type(spec['source_date_epoch']) is int and spec['source_date_epoch'] > 0
          assert len(spec['artifacts']) == 2, 'Release artifact hashes must be reviewed before publishing'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_DATE_EPOCH=' + str(spec['source_date_epoch']) + '\n')
          PY
      - name: Build the wheel from the sdist and check both descriptions
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1 hatchling==1.32.4 twine==7.0.0 packaging==26.3
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Require the exact reviewed distribution files
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, pathlib
          spec = json.loads(pathlib.Path('RELEASE_BUILD.json').read_text())
          assert all(importlib.metadata.version(name) == version for name, version in spec['build_tools'].items())
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('dist').iterdir() if p.is_file()}
          assert actual == spec['artifacts'], 'Built distributions differ from the reviewed release files'
          print('Both distribution hashes match the reviewed release')
          PY
      - name: Verify the installed package
        run: |
          python -m venv /tmp/muster-install
          /tmp/muster-install/bin/python -m pip install dist/*.whl
          /tmp/muster-install/bin/python -m pip check
          cd /tmp
          /tmp/muster-install/bin/python -c "import muster; from importlib.metadata import version; assert version('muster-memory') == '${RELEASE_TAG#v}'; print(version('muster-memory'))"
          /tmp/muster-install/bin/muster --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: |
            dist/
            RELEASE_BUILD.json
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/muster-memory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: .
      - name: Verify the retained distributions before publication
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          spec = json.loads(pathlib.Path('RELEASE_BUILD.json').read_text())
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('dist').iterdir() if p.is_file()}
          assert len(actual) == 2 and actual == spec['artifacts'], 'Downloaded release files differ from the reviewed hashes'
          PY
      - name: Publish using the registered PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
